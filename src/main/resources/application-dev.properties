spring.datasource.url=jdbc:postgresql://localhost:5432/insurance_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}
risk.service.url=${RISK_SERVICE_URL:http://localhost:8082}

resilience4j.circuitbreaker.instances.customerService.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.customerService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.riskService.sliding-window-size=10
resilience4j.circuitbreaker.instances.riskService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.riskService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.riskService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.riskService.automatic-transition-from-open-to-half-open-enabled=true